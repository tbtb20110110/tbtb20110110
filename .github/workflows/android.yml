
name: Build Clash Boot Helper

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.1'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/tw/haier/clashboot

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'ClashBootHelper'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'tw.haier.clashboot'
              compileSdk 34

              defaultConfig {
                  applicationId 'tw.haier.clashboot'
                  minSdk 23
                  targetSdk 28
                  versionCode 2
                  versionName '1.1'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>

              <application
                  android:label="Clash开机助手"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      </intent-filter>
                  </receiver>

                  <service
                      android:name=".BootService"
                      android:exported="false"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/tw/haier/clashboot/BootReceiver.java <<'EOF'
          package tw.haier.clashboot;

          import android.content.*;
          import android.os.*;
          import android.widget.Toast;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent i) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(i.getAction())) {
                      Toast.makeText(
                          c,
                          "Clash 开机助手已启动",
                          Toast.LENGTH_LONG
                      ).show();

                      Intent s = new Intent(c, BootService.class);
                      s.setAction("BOOT_START");

                      if (Build.VERSION.SDK_INT >= 26) {
                          c.startForegroundService(s);
                      } else {
                          c.startService(s);
                      }
                  }
              }
          }
          EOF

          cat > app/src/main/java/tw/haier/clashboot/MainActivity.java <<'EOF'
          package tw.haier.clashboot;

          import android.app.*;
          import android.content.*;
          import android.os.*;
          import android.widget.*;
          import java.io.*;

          public class MainActivity extends Activity {
              TextView status;
              TextView logs;
              Button refresh;
              Button start;

              void localLog(String s) {
                  try (FileOutputStream f =
                       openFileOutput("helper.log", MODE_APPEND)) {
                      f.write((s + "\n").getBytes("UTF-8"));
                  } catch (Exception ignored) {}
              }

              String readLocalLog() {
                  try {
                      ByteArrayOutputStream b = new ByteArrayOutputStream();
                      FileInputStream f = openFileInput("helper.log");
                      byte[] buf = new byte[2048];
                      int n;

                      while ((n = f.read(buf)) > 0) {
                          b.write(buf, 0, n);
                      }

                      f.close();
                      return b.toString("UTF-8");
                  } catch (Exception e) {
                      return "(暂无应用日志)\n";
                  }
              }

              void checkAdb() {
                  status.setText("正在检查 ADB 和 Clash……");
                  refresh.setEnabled(false);

                  new Thread(() -> {
                      try {
                          String cmd =
                              "echo ADB_SHELL_OK; " +
                              "date; " +
                              "if dumpsys activity services " +
                              "com.github.metacubex.clash.meta " +
                              "2>/dev/null | grep -q TunService; then " +
                              "echo CLASH_TUN_OK; " +
                              "else echo CLASH_TUN_MISSING; fi; " +
                              "if ps -A | grep -q '[c]lash-watch.sh'; then " +
                              "echo WATCHER_PROCESS_OK; " +
                              "else echo WATCHER_PROCESS_MISSING; fi; " +
                              "echo ====WATCHER_LOG====; " +
                              "tail -n 8 /data/local/tmp/clash-watch.log; " +
                              "echo ====HELPER_LOG====; " +
                              "tail -n 20 /data/local/tmp/clash-boot-helper.log";

                          String result = AdbShell.exec(cmd);
                          localLog("ADB check succeeded:\n" + result);

                          runOnUiThread(() -> {
                              String adb = result.contains("ADB_SHELL_OK")
                                  ? "ADB：shell 执行成功\n"
                                  : "ADB：未收到 shell 确认\n";

                              String clash = result.contains("CLASH_TUN_OK")
                                  ? "Clash：TunService 存在\n"
                                  : "Clash：未检测到 TunService\n";

                              String watcher =
                                  result.contains("WATCHER_PROCESS_OK")
                                  ? "Watcher：进程存在\n"
                                  : "Watcher：未检测到进程\n";

                              status.setText(adb + clash + watcher);

                              logs.setText(
                                  readLocalLog() +
                                  "\n\n==== 本次电视端检查 ====\n" +
                                  result
                              );

                              refresh.setEnabled(true);
                          });
                      } catch (Exception e) {
                          String err = "ADB 检查失败：" + e.toString();
                          localLog(err);

                          runOnUiThread(() -> {
                              status.setText("ADB：连接或 shell 执行失败");
                              logs.setText(readLocalLog() + "\n\n" + err);
                              refresh.setEnabled(true);
                          });
                      }
                  }).start();
              }

              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(20, 16, 20, 16);

                  TextView title = new TextView(this);
                  title.setText("Clash 开机助手");
                  title.setTextSize(24);
                  root.addView(title);

                  status = new TextView(this);
                  status.setTextSize(18);
                  status.setText("应用已打开，点击刷新检查状态");
                  root.addView(status);

                  refresh = new Button(this);
                  refresh.setText("刷新状态 / 查看日志");
                  root.addView(refresh);

                  start = new Button(this);
                  start.setText("启动 Clash 和 Watcher");
                  root.addView(start);

                  logs = new TextView(this);
                  logs.setTextSize(14);
                  logs.setTextIsSelectable(true);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(logs);

                  root.addView(scroll, new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      0,
                      1
                  ));

                  setContentView(root);

                  localLog("MainActivity opened");
                  logs.setText(readLocalLog());

                  refresh.setOnClickListener(v -> checkAdb());

                  start.setOnClickListener(v -> {
                      try {
                          Intent i = new Intent(this, BootService.class);
                          i.setAction("MANUAL_START");

                          if (Build.VERSION.SDK_INT >= 26) {
                              startForegroundService(i);
                          } else {
                              startService(i);
                          }

                          Toast.makeText(
                              this,
                              "已请求启动 Clash 和 Watcher",
                              Toast.LENGTH_SHORT
                          ).show();

                          localLog("Manual service start requested");
                          logs.setText(readLocalLog());
                      } catch (Exception e) {
                          Toast.makeText(
                              this,
                              "启动失败：" + e.toString(),
                              Toast.LENGTH_LONG
                          ).show();

                          localLog("Manual start failed: " + e);
                          logs.setText(readLocalLog());
                      }
                  });
              }
          }
          EOF

          cat > app/src/main/java/tw/haier/clashboot/BootService.java <<'EOF'
          package tw.haier.clashboot;

          import android.app.*;
          import android.content.*;
          import android.os.*;
          import java.io.*;

          public class BootService extends Service {
              static final String SHELL_LOG =
                  "/data/local/tmp/clash-boot-helper.log";

              void log(String s) {
                  String line = System.currentTimeMillis() + " " + s + "\n";

                  try (FileOutputStream f =
                       openFileOutput("helper.log", MODE_APPEND)) {
                      f.write(line.getBytes("UTF-8"));
                  } catch (Exception ignored) {}
              }

              @Override
              public void onCreate() {
                  super.onCreate();

                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(
                          "boot",
                          "Clash开机助手",
                          NotificationManager.IMPORTANCE_LOW
                      );

                      ((NotificationManager)getSystemService(
                          NOTIFICATION_SERVICE)).createNotificationChannel(ch);
                  }

                  Notification.Builder b = Build.VERSION.SDK_INT >= 26
                      ? new Notification.Builder(this, "boot")
                      : new Notification.Builder(this);

                  startForeground(
                      1,
                      b.setContentTitle("Clash开机助手")
                          .setContentText("正在检查本机 ADB 并启动 Clash")
                          .setSmallIcon(android.R.drawable.stat_notify_sync)
                          .build()
                  );

                  log("BootService created");
              }

              @Override
              public int onStartCommand(Intent i, int flags, int id) {
                  String action = i == null ? "" : i.getAction();
                  log("Service start action=" + action);

                  new Thread(() -> {
                      try {
                          Thread.sleep(30000);

                          String cmd =
                              "echo 'Helper shell started: $(date)' >> " +
                              SHELL_LOG + "; " +

                              "echo 'ADB shell command reached' >> " +
                              SHELL_LOG + "; " +

                              "am start -a " +
                              "com.github.metacubex.clash.meta.action.START_CLASH " +
                              "-p com.github.metacubex.clash.meta >> " +
                              SHELL_LOG + " 2>&1; " +

                              "sleep 5; " +

                              "if ps -A | grep -q '[c]lash-watch.sh'; then " +
                              "echo 'Watcher process already present' >> " +
                              SHELL_LOG + "; " +

                              "else " +

                              "/vendor/xbin/busybox nohup " +
                              "/vendor/xbin/busybox setsid " +
                              "/system/bin/sh " +
                              "/data/local/tmp/clash-watch.sh " +
                              "</dev/null >> " +
                              "/data/local/tmp/clash-watch.out 2>&1 & " +

                              "echo 'Watcher launch requested' >> " +
                              SHELL_LOG + "; " +
                              "fi; " +

                              "echo 'Helper finished: $(date)' >> " +
                              SHELL_LOG + "; " +

                              "tail -n 30 " + SHELL_LOG;

                          String result = AdbShell.exec(cmd);
                          log("ADB shell succeeded:\n" + result);

                      } catch (Throwable e) {
                          log("ADB ERROR: " + e.toString());
                      }

                      stopForeground(true);
                      stopSelf();
                  }).start();

                  return START_NOT_STICKY;
              }

              @Override
              public IBinder onBind(Intent i) {
                  return null;
              }
          }
          EOF

          cat > app/src/main/java/tw/haier/clashboot/AdbShell.java <<'EOF'
          package tw.haier.clashboot;

          import java.io.*;
          import java.net.*;
          import java.nio.charset.StandardCharsets;

          final class AdbShell {
              static void le(DataOutputStream o, int v) throws IOException {
                  o.write(v);
                  o.write(v >>> 8);
                  o.write(v >>> 16);
                  o.write(v >>> 24);
              }

              static int le(DataInputStream i) throws IOException {
                  return i.readUnsignedByte()
                      | i.readUnsignedByte() << 8
                      | i.readUnsignedByte() << 16
                      | i.readUnsignedByte() << 24;
              }

              static int code(String s) {
                  return s.charAt(0)
                      | s.charAt(1) << 8
                      | s.charAt(2) << 16
                      | s.charAt(3) << 24;
              }

              static void packet(
                  DataOutputStream o,
                  String s,
                  int a,
                  int b,
                  byte[] d
              ) throws IOException {
                  int c = code(s);
                  int n = d == null ? 0 : d.length;
                  int sum = 0;

                  if (d != null) {
                      for (byte x : d) sum += x & 255;
                  }

                  le(o, c);
                  le(o, a);
                  le(o, b);
                  le(o, n);
                  le(o, sum);
                  le(o, ~c);

                  if (n > 0) o.write(d);
                  o.flush();
              }

              static String exec(String cmd) throws Exception {
                  try (Socket s = new Socket()) {
                      s.connect(
                          new InetSocketAddress("127.0.0.1", 5555),
                          5000
                      );
                      s.setSoTimeout(15000);

                      DataInputStream in = new DataInputStream(
                          new BufferedInputStream(s.getInputStream())
                      );

                      DataOutputStream out = new DataOutputStream(
                          new BufferedOutputStream(s.getOutputStream())
                      );

                      packet(
                          out,
                          "CNXN",
                          0x01000001,
                          4096,
                          "host::features=shell_v2,cmd\n".getBytes(
                              StandardCharsets.UTF_8
                          )
                      );

                      int c = le(in);
                      int a = le(in);
                      int b = le(in);
                      int n = le(in);
                      int sum = le(in);
                      int magic = le(in);

                      if (magic != ~c || c != code("CNXN")) {
                          throw new IOException("ADB handshake failed");
                      }

                      byte[] banner = new byte[n];
                      in.readFully(banner);

                      packet(
                          out,
                          "OPEN",
                          1,
                          0,
                          ("shell:" + cmd + "\0").getBytes(
                              StandardCharsets.UTF_8
                          )
                      );

                      StringBuilder result = new StringBuilder();

                      while (true) {
                          c = le(in);
                          a = le(in);
                          b = le(in);
                          n = le(in);
                          sum = le(in);
                          magic = le(in);

                          if (magic != ~c || n < 0 || n > 1048576) {
                              throw new IOException("Bad ADB packet");
                          }

                          byte[] data = new byte[n];
                          in.readFully(data);

                          if (c == code("OKAY")) continue;

                          if (c == code("WRTE")) {
                              result.append(new String(
                                  data,
                                  StandardCharsets.UTF_8
                              ));

                              packet(out, "OKAY", 1, a, null);

                          } else if (c == code("CLSE")) {
                              packet(out, "CLSE", 1, a, null);
                              break;

                          } else if (c == code("FAIL")) {
                              throw new IOException(
                                  new String(
                                      data,
                                      StandardCharsets.UTF_8
                                  )
                              );

                          } else {
                              throw new IOException("Unexpected ADB packet");
                          }
                      }

                      return result.toString();
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClashBootHelper-APK
          path: app/build/outputs/apk/debug/app-debug.apk
